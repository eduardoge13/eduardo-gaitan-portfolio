services:
  eduardo-portfolio:
    build: .
    container_name: eduardo-portfolio
    restart: unless-stopped
    networks:
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.eduardo-portfolio.rule=Host(`eduardo.srv1175749.hstgr.cloud`)
      - traefik.http.routers.eduardo-portfolio.entrypoints=websecure
      - traefik.http.routers.eduardo-portfolio.tls=true
      - traefik.http.routers.eduardo-portfolio.tls.certresolver=mytlschallenge
      - traefik.http.services.eduardo-portfolio.loadbalancer.server.port=80

networks:
  n8n_default:
    external: true
